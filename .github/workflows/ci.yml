name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config libsodium-dev libgtest-dev

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Protocol smoke test
        run: ./build/psi

      - name: Benchmark self-check (small sizes)
        run: ./build/psi_bench 100 200
